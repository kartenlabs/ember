<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Ember — feedback</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script>window.EMBER_ICON_BASE='../../assets/icons';</script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:20px;background:var(--surface-app)}.grp{display:flex;flex-direction:column;gap:10px}.lbl{font-family:var(--font-pixel);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-muted)}.rw{display:flex;gap:12px;align-items:center;flex-wrap:wrap}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const {ProgressBar,Toast,Tooltip,Dialog,Button,IconButton}=window.EmberDesignSystem_e9992d;
function Demo(){
  return <div style={{display:'flex',flexDirection:'column',gap:22}}>
    <div className="grp"><span className="lbl">Progress · cells</span>
      <ProgressBar value={62} cells={40} label="Session" showValue/>
      <ProgressBar value={30} cells={16} size="sm"/>
    </div>
    <div className="rw" style={{alignItems:'flex-start',gap:20}}>
      <Toast tone="success" title="Session logged" message="25 minutes added to today." actionLabel="Undo" action={()=>{}} onDismiss={()=>{}}/>
      <div className="grp" style={{gap:14,paddingTop:20}}><span className="lbl">Tooltip · hover</span>
        <div className="rw">
          <Tooltip label="Reset timer" shortcut="R"><IconButton icon="reload" label="Reset"/></Tooltip>
          <Tooltip label="Mute chime" side="right"><IconButton icon="bell-off" label="Mute"/></Tooltip>
        </div>
      </div>
    </div>
    <div className="grp"><span className="lbl">Dialog · end of session</span>
      <div style={{position:'relative',height:200,border:'1px solid var(--border-subtle)',overflow:'hidden'}}>
        <div style={{position:'absolute',inset:0,transform:'scale(.9)'}}>
          <Dialog overline="Focus complete" title="Take five?" onClose={()=>{}} width="380px"
            footer={<><Button variant="ghost">Skip</Button><Button icon="coffee">Start break</Button></>}>
            Session four of six logged. Twenty five minutes.
          </Dialog>
        </div>
      </div>
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
