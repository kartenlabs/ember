<!-- @dsCard group="Colors" viewport="700x170" name="Daylight theme" subtitle="data-theme=\"light\" — same hues, inverted stack, for daytime desks." -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-app);font-family:var(--font-sans)}.row{display:flex;gap:var(--space-3);align-items:stretch}.col{display:flex;flex-direction:column;gap:var(--space-3)}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;padding:8px;min-height:88px;border:1px solid var(--border-subtle);border-radius:var(--radius-xs)}.sw b{font-family:var(--font-pixel);font-size:9px;letter-spacing:.12em;text-transform:uppercase}.sw i{font-family:var(--font-mono);font-size:10px;font-style:normal;opacity:.7}</style></head><body><div data-theme="light" style="display:flex;gap:var(--space-3);padding:14px;background:var(--surface-app);border:1px solid var(--border-subtle)">
<div style="flex:1;min-height:96px;background:var(--surface-app);border:1px solid var(--border-subtle);padding:8px;display:flex;flex-direction:column;justify-content:space-between"><span style="font-family:var(--font-pixel);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted)">app</span><span style="font-family:var(--font-mono);font-size:11px;color:var(--text-primary)">25:00</span></div><div style="flex:1;min-height:96px;background:var(--surface-card);border:1px solid var(--border-subtle);padding:8px;display:flex;flex-direction:column;justify-content:space-between"><span style="font-family:var(--font-pixel);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted)">card</span><span style="font-family:var(--font-mono);font-size:11px;color:var(--text-primary)">25:00</span></div><div style="flex:1;min-height:96px;background:var(--surface-raised);border:1px solid var(--border-subtle);padding:8px;display:flex;flex-direction:column;justify-content:space-between"><span style="font-family:var(--font-pixel);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted)">raised</span><span style="font-family:var(--font-mono);font-size:11px;color:var(--text-primary)">25:00</span></div><div style="flex:1;min-height:96px;background:var(--surface-sunken);border:1px solid var(--border-subtle);padding:8px;display:flex;flex-direction:column;justify-content:space-between"><span style="font-family:var(--font-pixel);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted)">sunken</span><span style="font-family:var(--font-mono);font-size:11px;color:var(--text-primary)">25:00</span></div>
<div style="flex:1;min-height:96px;background:var(--accent-focus);display:flex;align-items:flex-end;padding:8px"><span style="font-family:var(--font-pixel);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-inverse)">accent</span></div>
</div></body></html>
