<!-- @dsCard group="Colors" viewport="700x150" name="States" subtitle="Semantic feedback. Danger is clay, not red; nothing here is saturated." -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-app);font-family:var(--font-sans)}.row{display:flex;gap:var(--space-3);align-items:stretch}.col{display:flex;flex-direction:column;gap:var(--space-3)}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;padding:8px;min-height:88px;border:1px solid var(--border-subtle);border-radius:var(--radius-xs)}.sw b{font-family:var(--font-pixel);font-size:9px;letter-spacing:.12em;text-transform:uppercase}.sw i{font-family:var(--font-mono);font-size:10px;font-style:normal;opacity:.7}</style></head><body><div class="row">
<div class="col" style="flex:1;padding:10px;border:1px solid var(--state-success);border-radius:var(--radius-xs)">
<span style="font-family:var(--font-pixel);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--state-success)">success</span>
<span style="font-family:var(--font-sans);font-size:12px;color:var(--text-muted)">session logged</span>
<span style="height:6px;background:var(--state-success)"></span></div><div class="col" style="flex:1;padding:10px;border:1px solid var(--state-warning);border-radius:var(--radius-xs)">
<span style="font-family:var(--font-pixel);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--state-warning)">warning</span>
<span style="font-family:var(--font-sans);font-size:12px;color:var(--text-muted)">chime muted</span>
<span style="height:6px;background:var(--state-warning)"></span></div><div class="col" style="flex:1;padding:10px;border:1px solid var(--state-danger);border-radius:var(--radius-xs)">
<span style="font-family:var(--font-pixel);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--state-danger)">danger</span>
<span style="font-family:var(--font-sans);font-size:12px;color:var(--text-muted)">clear the log</span>
<span style="height:6px;background:var(--state-danger)"></span></div><div class="col" style="flex:1;padding:10px;border:1px solid var(--state-info);border-radius:var(--radius-xs)">
<span style="font-family:var(--font-pixel);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--state-info)">info</span>
<span style="font-family:var(--font-sans);font-size:12px;color:var(--text-muted)">synced 2m ago</span>
<span style="height:6px;background:var(--state-info)"></span></div>
</div></body></html>
