<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-app);font-family:var(--font-sans)}.row{display:flex;gap:var(--space-3);align-items:stretch}.col{display:flex;flex-direction:column;gap:var(--space-3)}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;padding:8px;min-height:88px;border:1px solid var(--border-subtle);border-radius:var(--radius-xs)}.sw b{font-family:var(--font-pixel);font-size:9px;letter-spacing:.12em;text-transform:uppercase}.sw i{font-family:var(--font-mono);font-size:10px;font-style:normal;opacity:.7}</style></head><body><div class="row">
<div class="col" style="flex:1;gap:6px"><div style="height:64px;background:var(--surface-card);border:1px solid var(--border-default);border-radius:0px"></div><span style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted)">none · 0px · dividers</span></div><div class="col" style="flex:1;gap:6px"><div style="height:64px;background:var(--surface-card);border:1px solid var(--border-default);border-radius:2px"></div><span style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted)">xs · 2px · controls</span></div><div class="col" style="flex:1;gap:6px"><div style="height:64px;background:var(--surface-card);border:1px solid var(--border-default);border-radius:3px"></div><span style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted)">sm · 3px · cards</span></div><div class="col" style="flex:1;gap:6px"><div style="height:64px;background:var(--surface-card);border:1px solid var(--border-default);border-radius:4px"></div><span style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted)">md · 4px · panels</span></div>
<div class="col" style="flex:1;gap:6px"><div style="height:64px;background:var(--surface-card);border:2px solid var(--border-strong);border-radius:3px"></div><span style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted)">thick · 2px · dialogs</span></div>
</div></body></html>
