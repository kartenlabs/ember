<!-- @dsCard group="Brand" viewport="700x180" name="Motion" subtitle="Stepped easing for feedback, long linear fades for mood. No bounce." -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-app);font-family:var(--font-sans)}.row{display:flex;gap:var(--space-3);align-items:stretch}.col{display:flex;flex-direction:column;gap:var(--space-3)}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;padding:8px;min-height:88px;border:1px solid var(--border-subtle);border-radius:var(--radius-xs)}.sw b{font-family:var(--font-pixel);font-size:9px;letter-spacing:.12em;text-transform:uppercase}.sw i{font-family:var(--font-mono);font-size:10px;font-style:normal;opacity:.7}</style></head><body><div class="col" style="gap:var(--space-4)">
<div style="display:flex;align-items:center;gap:var(--space-4)"><span style="width:64px;font-family:var(--font-pixel);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-secondary)">instant</span><span style="flex:1;height:6px;background:linear-gradient(to right,var(--accent-focus) 2%,var(--surface-sunken) 2%)"></span><span style="width:150px;font-family:var(--font-mono);font-size:10px;color:var(--text-muted)">80ms · press collapse</span></div><div style="display:flex;align-items:center;gap:var(--space-4)"><span style="width:64px;font-family:var(--font-pixel);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-secondary)">fast</span><span style="flex:1;height:6px;background:linear-gradient(to right,var(--accent-focus) 3.5%,var(--surface-sunken) 3.5%)"></span><span style="width:150px;font-family:var(--font-mono);font-size:10px;color:var(--text-muted)">140ms · hover, toggle</span></div><div style="display:flex;align-items:center;gap:var(--space-4)"><span style="width:64px;font-family:var(--font-pixel);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-secondary)">medium</span><span style="flex:1;height:6px;background:linear-gradient(to right,var(--accent-focus) 6%,var(--surface-sunken) 6%)"></span><span style="width:150px;font-family:var(--font-mono);font-size:10px;color:var(--text-muted)">240ms · dialog, toast</span></div><div style="display:flex;align-items:center;gap:var(--space-4)"><span style="width:64px;font-family:var(--font-pixel);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-secondary)">slow</span><span style="flex:1;height:6px;background:linear-gradient(to right,var(--accent-focus) 12%,var(--surface-sunken) 12%)"></span><span style="width:150px;font-family:var(--font-mono);font-size:10px;color:var(--text-muted)">480ms · mode retint</span></div><div style="display:flex;align-items:center;gap:var(--space-4)"><span style="width:64px;font-family:var(--font-pixel);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-secondary)">breath</span><span style="flex:1;height:6px;background:linear-gradient(to right,var(--accent-focus) 100%,var(--surface-sunken) 100%)"></span><span style="width:150px;font-family:var(--font-mono);font-size:10px;color:var(--text-muted)">4000ms · session pulse</span></div>
<span style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted)">--ease-step: steps(3,end) · --ease-in-out: cubic-bezier(.4,0,.2,1)</span>
</div></body></html>
