<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-app);font-family:var(--font-sans)}.row{display:flex;gap:var(--space-3);align-items:stretch}.col{display:flex;flex-direction:column;gap:var(--space-3)}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;padding:8px;min-height:88px;border:1px solid var(--border-subtle);border-radius:var(--radius-xs)}.sw b{font-family:var(--font-pixel);font-size:9px;letter-spacing:.12em;text-transform:uppercase}.sw i{font-family:var(--font-mono);font-size:10px;font-style:normal;opacity:.7}</style></head><body><div class="col" style="gap:var(--space-5)">
<div class="col" style="gap:4px"><span style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted)">.em-title · 24px / 700</span><span class="em-title">Take five?</span></div>
<div class="col" style="gap:4px"><span style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted)">.em-subtitle · 16px / 400</span><span class="em-subtitle">Session four of six</span></div>
<div class="col" style="gap:4px"><span style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted)">.em-overline · 10px / .18em tracking</span><span class="em-overline">Focus · long break next</span></div>
</div></body></html>
