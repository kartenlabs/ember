<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-app);font-family:var(--font-sans)}.row{display:flex;gap:var(--space-3);align-items:stretch}.col{display:flex;flex-direction:column;gap:var(--space-3)}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;padding:8px;min-height:88px;border:1px solid var(--border-subtle);border-radius:var(--radius-xs)}.sw b{font-family:var(--font-pixel);font-size:9px;letter-spacing:.12em;text-transform:uppercase}.sw i{font-family:var(--font-mono);font-size:10px;font-style:normal;opacity:.7}</style></head><body><div class="row">
<div class="em-grid-bg" style="flex:1;height:110px;border:1px solid var(--border-subtle);display:flex;align-items:flex-end;padding:8px"><span style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted)">.em-grid-bg · 8px dot grid</span></div>
<div class="em-scanlines" style="flex:1;height:110px;background-color:var(--surface-card);border:1px solid var(--border-subtle);display:flex;align-items:flex-end;padding:8px"><span style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted)">.em-scanlines · 3px lines</span></div>
<div style="flex:1;height:110px;background:var(--surface-app);border:1px solid var(--border-subtle);display:flex;align-items:flex-end;padding:8px"><span style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted)">bare board · default</span></div>
</div></body></html>
