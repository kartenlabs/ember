<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-app);font-family:var(--font-sans)}.row{display:flex;gap:var(--space-3);align-items:stretch}.col{display:flex;flex-direction:column;gap:var(--space-3)}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;padding:8px;min-height:88px;border:1px solid var(--border-subtle);border-radius:var(--radius-xs)}.sw b{font-family:var(--font-pixel);font-size:9px;letter-spacing:.12em;text-transform:uppercase}.sw i{font-family:var(--font-mono);font-size:10px;font-style:normal;opacity:.7}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:var(--space-3)">
<div style="display:flex;align-items:center;gap:8px"><span style="width:22px;height:22px;flex:0 0 auto;background:var(--surface-app);border:1px solid var(--border-subtle)"></span><span style="font-family:var(--font-mono);font-size:10px;color:var(--text-secondary)">--surface-app</span></div><div style="display:flex;align-items:center;gap:8px"><span style="width:22px;height:22px;flex:0 0 auto;background:var(--surface-card);border:1px solid var(--border-subtle)"></span><span style="font-family:var(--font-mono);font-size:10px;color:var(--text-secondary)">--surface-card</span></div><div style="display:flex;align-items:center;gap:8px"><span style="width:22px;height:22px;flex:0 0 auto;background:var(--surface-raised);border:1px solid var(--border-subtle)"></span><span style="font-family:var(--font-mono);font-size:10px;color:var(--text-secondary)">--surface-raised</span></div><div style="display:flex;align-items:center;gap:8px"><span style="width:22px;height:22px;flex:0 0 auto;background:var(--surface-sunken);border:1px solid var(--border-subtle)"></span><span style="font-family:var(--font-mono);font-size:10px;color:var(--text-secondary)">--surface-sunken</span></div><div style="display:flex;align-items:center;gap:8px"><span style="width:22px;height:22px;flex:0 0 auto;background:var(--text-primary);border:1px solid var(--border-subtle)"></span><span style="font-family:var(--font-mono);font-size:10px;color:var(--text-secondary)">--text-primary</span></div><div style="display:flex;align-items:center;gap:8px"><span style="width:22px;height:22px;flex:0 0 auto;background:var(--text-secondary);border:1px solid var(--border-subtle)"></span><span style="font-family:var(--font-mono);font-size:10px;color:var(--text-secondary)">--text-secondary</span></div><div style="display:flex;align-items:center;gap:8px"><span style="width:22px;height:22px;flex:0 0 auto;background:var(--text-muted);border:1px solid var(--border-subtle)"></span><span style="font-family:var(--font-mono);font-size:10px;color:var(--text-secondary)">--text-muted</span></div><div style="display:flex;align-items:center;gap:8px"><span style="width:22px;height:22px;flex:0 0 auto;background:var(--accent-mode);border:1px solid var(--border-subtle)"></span><span style="font-family:var(--font-mono);font-size:10px;color:var(--text-secondary)">--accent-mode</span></div><div style="display:flex;align-items:center;gap:8px"><span style="width:22px;height:22px;flex:0 0 auto;background:var(--border-subtle);border:1px solid var(--border-subtle)"></span><span style="font-family:var(--font-mono);font-size:10px;color:var(--text-secondary)">--border-subtle</span></div><div style="display:flex;align-items:center;gap:8px"><span style="width:22px;height:22px;flex:0 0 auto;background:var(--border-default);border:1px solid var(--border-subtle)"></span><span style="font-family:var(--font-mono);font-size:10px;color:var(--text-secondary)">--border-default</span></div><div style="display:flex;align-items:center;gap:8px"><span style="width:22px;height:22px;flex:0 0 auto;background:var(--border-strong);border:1px solid var(--border-subtle)"></span><span style="font-family:var(--font-mono);font-size:10px;color:var(--text-secondary)">--border-strong</span></div><div style="display:flex;align-items:center;gap:8px"><span style="width:22px;height:22px;flex:0 0 auto;background:var(--focus-ring);border:1px solid var(--border-subtle)"></span><span style="font-family:var(--font-mono);font-size:10px;color:var(--text-secondary)">--focus-ring</span></div>
</div></body></html>
